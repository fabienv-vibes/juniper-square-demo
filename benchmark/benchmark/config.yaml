# --- Queries ---
# Each query needs a 'name' and either:
#   - 'sql' (used for both targets), or
#   - 'sql_dbsql' and 'sql_lakebase' (target-specific SQL)
#
# Optional per-query 'weight' (default 1) controls how often the query appears
# in the round-robin rotation. Example: weight=3 => appears 3x per cycle.
#
# Optional per-query 'targets' (default [dbsql, lakebase]) scopes which targets
# the query runs against. Example: targets: [dbsql] for DBSQL-only queries like
# Q7 (silver scan — silver tables are not synced to Lakebase).
#
# Optional per-query 'enabled' (default true). Set to false to skip a query
# entirely, e.g. a placeholder awaiting the real SQL body.
#
# DBSQL uses Spark SQL; Lakebase uses Postgres. Key differences handled:
#   - Date math: add_months(current_date(), -N)  vs  (current_date - interval 'N months')
#   - ROUND on doubles: ROUND(x, N)  vs  ROUND(x::numeric, N)
#   - Catalog prefix: juniper_square_demo_catalog.pipeline.X  vs  serving.X
#
# The '{arena_id}' placeholder is substituted with a random pick from
# arena_id_pool at execution time. No SQL prepared statements are used.

queries:
  - name: "fund_performance_arena"
    weight: 2
    sql_dbsql: |
      SELECT *
      FROM juniper_square_demo_catalog.pipeline.gold_fund_performance
      WHERE arena_id = '{arena_id}'
      ORDER BY total_aum DESC
    sql_lakebase: |
      SELECT *
      FROM serving.gold_fund_performance
      WHERE arena_id = '{arena_id}'
      ORDER BY total_aum DESC

  - name: "gl_monthly_by_arena_year"
    weight: 3
    sql_dbsql: |
      SELECT
        category,
        month,
        SUM(total_amount) AS total_amount,
        SUM(transaction_count) AS transaction_count,
        ROUND(AVG(avg_transaction_amount), 2) AS avg_transaction_amount
      FROM juniper_square_demo_catalog.pipeline.gold_gl_monthly_summary
      WHERE arena_id = '{arena_id}'
        AND month >= add_months(current_date(), -12)
      GROUP BY category, month
      ORDER BY month, category
    sql_lakebase: |
      SELECT
        category,
        month,
        SUM(total_amount) AS total_amount,
        SUM(transaction_count) AS transaction_count,
        ROUND(AVG(avg_transaction_amount)::numeric, 2) AS avg_transaction_amount
      FROM serving.gold_gl_monthly_summary
      WHERE arena_id = '{arena_id}'
        AND month >= (current_date - interval '12 months')
      GROUP BY category, month
      ORDER BY month, category

  - name: "property_financials_joined"
    weight: 3
    sql_dbsql: |
      SELECT
        pf.property_id,
        pf.property_name,
        pf.property_type,
        a.arena_name,
        pf.fund_name,
        pf.month,
        pf.revenue,
        pf.expenses,
        pf.noi,
        pf.occupancy_rate
      FROM juniper_square_demo_catalog.pipeline.gold_property_financials pf
      JOIN juniper_square_demo_catalog.pipeline.silver_arenas a
        ON a.arena_id = pf.arena_id
      WHERE pf.arena_id = '{arena_id}'
        AND pf.month >= add_months(current_date(), -6)
      ORDER BY pf.month DESC, pf.noi DESC
      LIMIT 100
    sql_lakebase: |
      SELECT
        pf.property_id,
        pf.property_name,
        pf.property_type,
        a.arena_name,
        pf.fund_name,
        pf.month,
        pf.revenue,
        pf.expenses,
        pf.noi,
        pf.occupancy_rate
      FROM serving.gold_property_financials pf
      JOIN serving.silver_arenas a
        ON a.arena_id = pf.arena_id
      WHERE pf.arena_id = '{arena_id}'
        AND pf.month >= (current_date - interval '6 months')
      ORDER BY pf.month DESC, pf.noi DESC
      LIMIT 100

  - name: "top10_properties_by_revenue"
    weight: 2
    sql_dbsql: |
      WITH ttm AS (
        SELECT
          property_id,
          property_name,
          property_type,
          fund_name,
          SUM(revenue) AS revenue_ttm,
          SUM(noi) AS noi_ttm,
          AVG(occupancy_rate) AS avg_occupancy
        FROM juniper_square_demo_catalog.pipeline.gold_property_financials
        WHERE arena_id = '{arena_id}'
          AND month >= add_months(current_date(), -12)
        GROUP BY property_id, property_name, property_type, fund_name
      ),
      ranked AS (
        SELECT
          ttm.*,
          RANK() OVER (ORDER BY revenue_ttm DESC) AS revenue_rank
        FROM ttm
      )
      SELECT *
      FROM ranked
      WHERE revenue_rank <= 10
      ORDER BY revenue_rank
      LIMIT 10
    sql_lakebase: |
      WITH ttm AS (
        SELECT
          property_id,
          property_name,
          property_type,
          fund_name,
          SUM(revenue) AS revenue_ttm,
          SUM(noi) AS noi_ttm,
          AVG(occupancy_rate) AS avg_occupancy
        FROM serving.gold_property_financials
        WHERE arena_id = '{arena_id}'
          AND month >= (current_date - interval '12 months')
        GROUP BY property_id, property_name, property_type, fund_name
      ),
      ranked AS (
        SELECT
          ttm.*,
          RANK() OVER (ORDER BY revenue_ttm DESC) AS revenue_rank
        FROM ttm
      )
      SELECT *
      FROM ranked
      WHERE revenue_rank <= 10
      ORDER BY revenue_rank
      LIMIT 10

  - name: "pnl_rollup_multi_month"
    weight: 2
    sql_dbsql: |
      SELECT
        f.fund_id,
        f.fund_name,
        f.strategy,
        f.vintage_year,
        gl.month,
        SUM(CASE WHEN gl.category = 'revenue' THEN gl.total_amount ELSE 0 END) AS revenue,
        SUM(CASE WHEN gl.category = 'expense' THEN gl.total_amount ELSE 0 END) AS expenses,
        SUM(CASE WHEN gl.category = 'revenue' THEN gl.total_amount ELSE 0 END)
          - SUM(CASE WHEN gl.category = 'expense' THEN gl.total_amount ELSE 0 END) AS net_income,
        SUM(gl.transaction_count) AS transaction_count,
        ROUND(AVG(gl.avg_transaction_amount), 2) AS avg_txn_amount
      FROM juniper_square_demo_catalog.pipeline.gold_gl_monthly_summary gl
      JOIN juniper_square_demo_catalog.pipeline.silver_funds f
        ON f.fund_id = gl.fund_id AND f.arena_id = gl.arena_id
      WHERE gl.arena_id = '{arena_id}'
        AND gl.month >= add_months(current_date(), -24)
      GROUP BY f.fund_id, f.fund_name, f.strategy, f.vintage_year, gl.month
      ORDER BY f.fund_name, gl.month
    sql_lakebase: |
      SELECT
        f.fund_id,
        f.fund_name,
        f.strategy,
        f.vintage_year,
        gl.month,
        SUM(CASE WHEN gl.category = 'revenue' THEN gl.total_amount ELSE 0 END) AS revenue,
        SUM(CASE WHEN gl.category = 'expense' THEN gl.total_amount ELSE 0 END) AS expenses,
        SUM(CASE WHEN gl.category = 'revenue' THEN gl.total_amount ELSE 0 END)
          - SUM(CASE WHEN gl.category = 'expense' THEN gl.total_amount ELSE 0 END) AS net_income,
        SUM(gl.transaction_count) AS transaction_count,
        ROUND(AVG(gl.avg_transaction_amount)::numeric, 2) AS avg_txn_amount
      FROM serving.gold_gl_monthly_summary gl
      JOIN serving.silver_funds f
        ON f.fund_id = gl.fund_id AND f.arena_id = gl.arena_id
      WHERE gl.arena_id = '{arena_id}'
        AND gl.month >= (current_date - interval '24 months')
      GROUP BY f.fund_id, f.fund_name, f.strategy, f.vintage_year, gl.month
      ORDER BY f.fund_name, gl.month

  - name: "investor_commitment_summary"
    weight: 3
    sql_dbsql: |
      SELECT
        i.investor_id,
        i.investor_name,
        i.type,
        i.city,
        i.state,
        SUM(i.commitment_amount) AS total_commitment,
        COUNT(DISTINCT i.fund_id) AS fund_count,
        array_agg(DISTINCT f.fund_name) AS funds
      FROM juniper_square_demo_catalog.pipeline.silver_investors i
      JOIN juniper_square_demo_catalog.pipeline.silver_funds f
        ON f.fund_id = i.fund_id AND f.arena_id = i.arena_id
      WHERE i.arena_id = '{arena_id}'
      GROUP BY i.investor_id, i.investor_name, i.type, i.city, i.state
      ORDER BY total_commitment DESC
    sql_lakebase: |
      SELECT
        i.investor_id,
        i.investor_name,
        i.type,
        i.city,
        i.state,
        SUM(i.commitment_amount) AS total_commitment,
        COUNT(DISTINCT i.fund_id) AS fund_count,
        array_agg(DISTINCT f.fund_name) AS funds
      FROM serving.silver_investors i
      JOIN serving.silver_funds f
        ON f.fund_id = i.fund_id AND f.arena_id = i.arena_id
      WHERE i.arena_id = '{arena_id}'
      GROUP BY i.investor_id, i.investor_name, i.type, i.city, i.state
      ORDER BY total_commitment DESC

  - name: "worst_case_yoy_growth"
    weight: 1
    targets: [dbsql]
    sql_dbsql: |
      WITH annual_revenue AS (
        SELECT
          gl.property_id,
          gl.fiscal_year,
          SUM(CASE WHEN gl.category = 'revenue' THEN gl.amount ELSE 0 END) AS rev,
          COUNT(DISTINCT gl.counterparty_id) AS counterparty_count
        FROM juniper_square_demo_catalog.pipeline.silver_gl_transactions gl
        JOIN juniper_square_demo_catalog.pipeline.silver_properties p
          ON p.property_id = gl.property_id
        JOIN juniper_square_demo_catalog.pipeline.silver_funds f
          ON f.fund_id = gl.fund_id
        WHERE gl.fiscal_year BETWEEN year(current_date()) - 3 AND year(current_date())
          AND gl.approval_status = 'approved'
          AND gl.currency = 'USD'
        GROUP BY gl.property_id, gl.fiscal_year
      ),
      growth AS (
        SELECT
          property_id, fiscal_year, rev, counterparty_count,
          LAG(rev) OVER (PARTITION BY property_id ORDER BY fiscal_year) AS prev_rev,
          (rev - LAG(rev) OVER (PARTITION BY property_id ORDER BY fiscal_year))
            / NULLIF(LAG(rev) OVER (PARTITION BY property_id ORDER BY fiscal_year), 0) AS yoy_growth
        FROM annual_revenue
      ),
      ranked AS (
        SELECT
          property_id, fiscal_year, rev, prev_rev, yoy_growth, counterparty_count,
          RANK() OVER (PARTITION BY fiscal_year ORDER BY yoy_growth DESC) AS rnk
        FROM growth
        WHERE yoy_growth IS NOT NULL
      )
      SELECT property_id, fiscal_year, rev, prev_rev, yoy_growth, counterparty_count, rnk
      FROM ranked
      WHERE rnk <= 100
      ORDER BY fiscal_year DESC, rnk
      LIMIT 300

  - name: "shaz_production"
    weight: 1
    enabled: false
    sql_dbsql: |
      -- TBD: Shaz's scariest production SQL query (pending as of 2026-04-24).
      SELECT 1 AS placeholder
    sql_lakebase: |
      SELECT 1 AS placeholder
