# Concurrency Benchmark Configuration
# Copy this file and fill in your connection details.

# --- DBSQL Connection ---
dbsql:
  hostname: "fevm-juniper-square-demo.cloud.databricks.com"
  # juniper-benchmark-warehouse: Medium Pro, autoscale min=1 max=4, 10-min auto-stop.
  # Created 2026-04-24 for the scale-up / redline benchmark. The old Small fixed
  # warehouse (133b52f9331b883d) still exists for app references and side experiments.
  http_path: "/sql/1.0/warehouses/aae8e7baf626bd0d"
  token: "YOUR_DATABRICKS_TOKEN"

# --- Lakebase Connection ---
lakebase:
  host: "ep-curly-sun-d24e8bfa.database.us-east-1.cloud.databricks.com"
  port: 5432
  database: "juniper_serving"
  user: "YOUR_USER"
  password: "YOUR_TOKEN"
  sslmode: "require"

# --- Benchmark Parameters (lockstep mode — current default) ---
benchmark:
  # Concurrency profile for the 2 TB scale-up / redline run. Pushes hard enough to
  # demonstrate Medium Pro 1->8 warehouse scale-out and Lakebase 1->4 CU scale-up.
  # Concurrency 100 is the high-water mark expected to fire scale-out events on
  # both targets.
  levels: [5, 10, 20, 50, 100]
  iterations: 5       # measured rounds per level
  warmup: 1           # warmup rounds (excluded from stats)

# --- Sustained-rate Scenarios (mode=sustained) ---
# Realistic workload simulation: queries arrive on a Poisson schedule at a target
# QPS for a fixed wall-clock duration. Defeats coordinated omission, matches real
# Looker/dashboard traffic. Each scenario invokable via --scenario <name>.
#
# Workload calibration from Shaz's 2026-04-23 numbers:
#   - Peak Looker BI: 5 QPS spikes during workday
#   - Dashboards: 100/day (bursty, included implicitly in mix)
#   - Daily company-wide: ~30K queries
#   - June 2026 rollout: ~5x current data volume (4.5B documents)
sustained_scenarios:
  sustained_peak:
    rate_qps: 5.0
    duration_seconds: 600    # 10 min measurement
    warmup_seconds: 90        # 90s warmup, kept and visible as cold-start chart
    arrival_distribution: poisson
    # No query_filter -- runs the weighted dashboard mix Q1-Q6.
    # Q7 is targets:[dbsql] only (won't be in mix when target=lakebase).

  sustained_headroom_2x:
    rate_qps: 10.0
    duration_seconds: 600
    warmup_seconds: 90
    arrival_distribution: poisson

  sustained_scale_4x:
    rate_qps: 20.0
    duration_seconds: 600
    warmup_seconds: 90
    arrival_distribution: poisson
    # Tests the June rollout / 1K->10K customer scale claim.
    # Pre-flight: warehouse max-clusters bumped to 8 (done 2026-04-28).

  sustained_worst_case_q7:
    rate_qps: 1.0
    duration_seconds: 600
    warmup_seconds: 90
    arrival_distribution: poisson
    query_filter: ["worst_case_yoy_growth"]
    # Q7-only at 1 QPS -- represents an analyst drip of silver-scan ad-hoc queries.
    # 600 samples; autoscale settled by end of warmup. Clean steady-state Q7 cost.

  # Rerun-only scenario (added 2026-04-28): clean 5 QPS dashboard-only number
  # with extended 180s warmup. The original sustained_peak run included Q7 in the
  # weighted mix, which contaminated the median P95 with cold-start outliers
  # (~77s spike). This scenario filters Q7 out and warms longer so IWM is fully
  # provisioned before measurement starts.
  sustained_peak_dashboard_only:
    rate_qps: 5.0
    duration_seconds: 600
    warmup_seconds: 180
    arrival_distribution: poisson
    query_filter:
      - "fund_performance_arena"
      - "gl_monthly_by_arena_year"
      - "property_financials_joined"
      - "top10_properties_by_revenue"
      - "pnl_rollup_multi_month"
      - "investor_commitment_summary"

# --- Delta persistence target (where benchmark_runs / benchmark_summary / benchmark_raw are written) ---
# Writes go through the dbsql connection above. Disable per-run with --skip-delta-write.
delta_persistence:
  catalog: "juniper_square_demo_catalog"
  schema: "pipeline"
  notes: ""          # free-form notes stored on the benchmark_runs row

